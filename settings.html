<div id="payload_spy_settings" class="payload-spy-settings">
    <h3>Payload Spy</h3>
    <label class="checkbox_label">
        <input id="ps_enabled" type="checkbox" />
        Перехватывать запросы генерации
    </label>
    <small class="ps-hint">Анализирует JSON перед отправкой и usage из ответа. Запрос передаётся дальше без изменения.</small>

    <label class="checkbox_label">
        <input id="ps_toast" type="checkbox" />
        Показывать уведомление после запроса
    </label>

    <div class="ps-buttons">
        <button id="ps_open" class="menu_button">Открыть последний отчёт</button>
        <button id="ps_clear" class="menu_button">Очистить историю</button>
    </div>
</div>
